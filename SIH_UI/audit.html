<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Log — PRAMAAN AI</title>
<link rel="stylesheet" href="assets/fonts/inter.css">
<link rel="stylesheet" href="assets/fonts/jetbrains-mono.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<script src="js/config.js"></script>
<script src="js/mock-api.js"></script>
<script src="js/app.js"></script>
<script>
const main = PRAMAAN.mount('audit');

main.innerHTML = `
  <div class="page-head">
    <div>
      <h1>Audit log</h1>
      <div class="page-sub">Immutable screening ledger — Raxaul ICP · SHA-256 anchored</div>
    </div>
    <input type="text" class="search" placeholder="Search by case ref or officer badge" id="auditSearch">
  </div>
  <div class="panel panel--flat">
    <div style="overflow-x:auto;">
      <table class="audit-table" id="auditTable">
        <thead>
          <tr>
            <th style="cursor:pointer; user-select:none;">TIMESTAMP<svg style="width:12px;height:12px;margin-left:4px;opacity:0.4;vertical-align:middle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg></th>
            <th>CASE REF</th>
            <th>DOCUMENT</th>
            <th>ANCHOR HASH</th>
            <th style="cursor:pointer; user-select:none;">RISK<svg style="width:12px;height:12px;margin-left:4px;opacity:0.4;vertical-align:middle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg></th>
            <th>DECISION</th>
            <th>CHECKPOST</th>
          </tr>
        </thead>
        <tbody id="auditBody">
          <tr><td colspan="7" style="text-align:center; color:var(--text-secondary); padding:24px;">Loading audit log…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
`;

const decisionMap = {
  clear:  ['status-clear',  `${PRAMAAN.ICONS.check} Clear`],
  pass:   ['status-clear',  `${PRAMAAN.ICONS.check} Pass`],
  flag:   ['status-flag',   `${PRAMAAN.ICONS.flagIcon} Flag`],
  reject: ['status-reject', `${PRAMAAN.ICONS.x} Reject`],
};
const defaultDecision = ['status-pending', 'Logged'];

async function renderAudit() {
  const LOG = await API.fetchAuditLog();
  const body = document.getElementById('auditBody');

  if (!LOG || LOG.length === 0) {
    body.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--text-secondary); padding:24px;">No audit records yet. Screening events will appear here after pipeline runs.</td></tr>';
    return;
  }

  let html = '';
  for (const row of LOG) {
    const h = await PRAMAAN.hashFromRef(row.ref || 'unknown');
    const [cls, label] = decisionMap[row.dec] || defaultDecision;
    html += `<tr>
      <td class="mono">02 Sep, ${row.t || '—'}</td>
      <td class="mono" style="color:var(--navy);">${row.ref || '—'}</td>
      <td><div style="display:flex; align-items:center; gap:6px;">${PRAMAAN.ICONS.doc} ${row.doc || '—'}</div></td>
      <td class="mono hashcell" title="${h}">${PRAMAAN.truncHash(h)}</td>
      <td style="font-weight:600;">${row.risk != null ? row.risk : '—'}</td>
      <td><span class="status ${cls}">${label}</span></td>
      <td style="color:var(--text-secondary);">${row.cp || '—'}</td>
    </tr>`;
  }
  body.innerHTML = html;
}

renderAudit();
</script>
</body>
</html>
