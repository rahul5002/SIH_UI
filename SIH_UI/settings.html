<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — PRAMAAN AI</title>
<link rel="stylesheet" href="assets/fonts/inter.css">
<link rel="stylesheet" href="assets/fonts/jetbrains-mono.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<script src="js/config.js"></script>
<script src="js/mock-api.js"></script>
<script src="js/app.js"></script>
<script>
const main = PRAMAAN.mount('settings');

main.innerHTML = `
  <div class="page-head">
    <div>
      <h1>Settings</h1>
      <div class="page-sub">Local environment configuration — Raxaul ICP</div>
    </div>
  </div>

  <div class="settings-section panel--flat">
    <h2>Offline &amp; sync</h2>
    <div class="panel panel--flat">
      <div class="settings-row">
        <div>
          <div class="lbl">Screen without connectivity</div>
          <div class="desc">Continue capturing and anchoring events locally when no uplink is available. Recommended — always on at BOPs with intermittent connectivity.</div>
        </div>
        <button class="toggle on"></button>
      </div>
      <div class="settings-row">
        <div>
          <div class="lbl">Auto-sync on reconnect</div>
          <div class="desc">Push queued ledger blocks to Frontier HQ automatically when a network link is detected.</div>
        </div>
        <button class="toggle on"></button>
      </div>
      <div class="settings-row">
        <div>
          <div class="lbl">Sync over cellular data</div>
          <div class="desc">Allow sync over mobile data in addition to wired/Wi-Fi uplinks. Uses officer-issued SIM at this post.</div>
        </div>
        <button class="toggle"></button>
      </div>
    </div>
  </div>

  <div class="settings-section panel--flat">
    <h2>Checkpost &amp; language</h2>
    <div class="panel panel--flat">
      <div class="settings-row">
        <div>
          <div class="lbl">Assigned checkpost</div>
          <div class="desc">Raxaul ICP — Sector 4, Bihar. Reassignment requires Frontier HQ approval.</div>
        </div>
        <button class="btn btn-sm">Request reassignment</button>
      </div>
      <div class="settings-row">
        <div>
          <div class="lbl">Interface language</div>
          <div class="desc">Display language for labels, alerts, and decision prompts.</div>
        </div>
        <div style="font-size:12.5px; color:var(--text-secondary); font-weight:500;">English · हिन्दी — coming soon</div>
      </div>
    </div>
  </div>

  <div class="settings-section panel--flat">
    <h2>Screening thresholds</h2>
    <div class="panel panel--flat">
      <div class="settings-row">
        <div>
          <div class="lbl">Auto-flag risk threshold</div>
          <div class="desc">Cases scoring at or above this composite risk score are routed to mandatory second-officer review.</div>
        </div>
        <span class="mono" style="font-weight:700; color:var(--navy);" id="stAutoFlag"></span>
      </div>
      <div class="settings-row">
        <div>
          <div class="lbl">Face match minimum confidence</div>
          <div class="desc">Minimum ArcFace similarity score to accept a live face against the document photo.</div>
        </div>
        <span class="mono" style="font-weight:700; color:var(--navy);" id="stFaceMatch"></span>
      </div>
    </div>
  </div>
`;

// Populate thresholds from config.js — single source of truth
document.getElementById('stAutoFlag').textContent = CONFIG.THRESHOLDS.AUTO_FLAG_RISK + ' / 100';
document.getElementById('stFaceMatch').textContent = CONFIG.THRESHOLDS.FACE_MATCH_MIN;

document.querySelectorAll('.toggle').forEach(t => t.addEventListener('click', () => t.classList.toggle('on')));
</script>
</body>
</html>
