<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkpoints — PRAMAAN AI</title>
<link rel="stylesheet" href="assets/fonts/inter.css">
<link rel="stylesheet" href="assets/fonts/jetbrains-mono.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<script src="js/config.js"></script>
<script src="js/mock-api.js"></script>
<script src="js/app.js"></script>
<script>
const main = PRAMAAN.mount('checkpoints');

main.innerHTML = `
  <div class="page-head">
    <div>
      <h1>Active checkpoints</h1>
      <div class="page-sub">Live status of SSB boundary outposts</div>
    </div>
    <div class="seg" id="regionSeg">
      <button class="on">All</button>
      <button>Indo-Nepal</button>
      <button>Indo-Bhutan</button>
    </div>
  </div>
  <div class="cp-grid" id="cpGrid">
    <div style="color:var(--text-secondary); font-size:13px;">Loading checkpoints…</div>
  </div>
`;

async function renderCheckpoints(regionFilter) {
  const data = await API.fetchCheckpoints(regionFilter);
  if (!data || data.length === 0) {
    document.getElementById('cpGrid').innerHTML = '<div style="color:var(--text-secondary); font-size:13px; padding:24px;">No checkpoint data available. Backend checkpoint API not yet connected.</div>';
    return;
  }
  document.getElementById('cpGrid').innerHTML = data.map(c => `
    <div class="cp-card">
      <div class="head">
        <div>
          <div class="name">${c.name}</div>
          <div class="meta">${c.sector} · ${c.state}</div>
        </div>
        <div class="region-tag">${c.region === 'indo-nepal' ? '🇳🇵 Indo-Nepal' : '🇧🇹 Indo-Bhutan'}</div>
      </div>
      <div class="body">
        <div class="cross">Cross-border flow: <span style="font-weight:600; color:var(--text-primary);">${c.cross}</span></div>
        <div class="rowstats">
          <div class="s"><div class="k">Officers online</div><div class="v">${c.officers}</div></div>
          <div class="s"><div class="k">Screened (shift)</div><div class="v">${c.screened}</div></div>
          <div class="s"><div class="k">Flagged</div><div class="v" style="color:var(--flag);">${c.flagged}</div></div>
          <div class="s"><div class="k">Avg sec/case</div><div class="v">${c.avgSec}s</div></div>
        </div>
      </div>
    </div>
  `).join('');
}

document.getElementById('regionSeg').querySelectorAll('button').forEach(b => {
  b.addEventListener('click', e => {
    document.querySelectorAll('#regionSeg button').forEach(x => x.classList.remove('on'));
    e.target.classList.add('on');
    const label = e.target.textContent.trim();
    const region = label.includes('Nepal') ? 'indo-nepal' : label.includes('Bhutan') ? 'indo-bhutan' : 'all';
    renderCheckpoints(region);
  });
});

renderCheckpoints('all');
</script>
</body>
</html>
