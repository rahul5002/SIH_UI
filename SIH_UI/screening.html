// ---- Gauge chart ----
let gaugeChart;
function drawGauge(score) {
  const ctx = document.getElementById('gauge');
  const threshold = CONFIG.THRESHOLDS.AUTO_FLAG_RISK;
  const color = score < 30 ? '#38A169' : score < threshold ? '#D69E2E' : '#C53030';
  if (gaugeChart) gaugeChart.destroy();
  gaugeChart = new Chart(ctx, {
    type: 'doughnut',
    data: { datasets: [{ data: [score, 100 - score], backgroundColor: [color, '#E7ECF2'], borderWidth: 0 }] },
    options: {
      circumference: 180, rotation: 270, cutout: '75%',
      plugins: { legend: { display: false }, tooltip: { enabled: false } }
    }
  });
}
drawGauge(0);

function drawGaugeAnimated(target) {
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduced) {
    document.getElementById('gaugeNum').innerHTML = target + '<span class="of">/100</span>';
    drawGauge(target);
    return;
  }
  
  const el = document.getElementById('gaugeNum');
  const duration = 1200;
  const start = performance.now();
  
  function easeOutQuart(x) { return 1 - Math.pow(1 - x, 4); }
  
  function animate(time) {
    let progress = (time - start) / duration;
    if (progress > 1) progress = 1;
    
    const cur = Math.round(target * easeOutQuart(progress));
    el.innerHTML = cur + '<span class="of">/100</span>';
    drawGauge(cur);
    
    if (progress < 1) requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
}


// ---- Stage rail helpers ----
window.stageStates = [];
function setStage(idx, state) {
  if (state && state !== 'active') {
    window.stageStates[idx] = state;
  }
  document.querySelectorAll('.p-stage').forEach((n, i) => {
    n.classList.remove('active', 'done', 'flagged', 'error', 'unavailable');
    if (i === idx && state === 'active') {
      n.classList.add('active');
    } else if (i <= idx && window.stageStates[i]) {
      n.classList.add(window.stageStates[i]);
    }
  });
}

// ---- Pipeline orchestration ----
const caseRef = 'RAX-20260902-0312';
let abortController = new AbortController();

async function runPipeline(payload, signal) {
  try {
    const mode = payload.mode || 'live';
    localStorage.setItem('pramaan_active_bg_case', caseRef);

    // Stage 2 — Extract (OCR)

    setStage(1, 'active');
    document.getElementById('stageDetail').innerHTML =
      `<strong style="color:var(--navy);">02 Extract</strong> — ${stageDetails.extract} <span class="tag">extract</span>`;
    let extractRes;
    try {
      extractRes = await API.stageExtract(payload);
    } catch (err) {
      if (signal.aborted) return;
      document.getElementById('stageDetail').innerHTML =
        `<strong style="color:var(--reject);">02 Extract</strong> — OCR extraction failed — low-quality capture. Ambient light insufficient. Retrying (attempt 3 of 3)… <br><br>
         <button class="btn btn-sm" onclick="initMode('flagged')">↺ Retry with standard capture</button>`;
      setStage(1, 'error');
      document.getElementById('pipelineMeta').textContent = 'Failed — OCR error';
      return;
    }
    if (signal.aborted) return;

    // Update OCR readout safely handles UNAVAILABLE
    document.getElementById('roName').textContent = extractRes?.data?.name || 'Pending integration';
    document.getElementById('roDoc').textContent  = extractRes?.data?.docNo || '---';
    document.getElementById('roDob').textContent  = extractRes?.data?.dob || '---';
    document.getElementById('roExp').textContent  = extractRes?.data?.expiry || '---';
    document.getElementById('fieldReadout').style.opacity = '1';
    setStage(1, extractRes?.status === 'UNAVAILABLE' ? 'unavailable' : 'done');

    // Stage 3 — Validate
    setStage(2, 'active');
    document.getElementById('stageDetail').innerHTML =
      `<strong style="color:var(--navy);">03 Validate</strong> — ${stageDetails.validate} <span class="tag">validate</span>`;
    const validateRes = await API.stageValidate(payload);
    if (signal.aborted) return;
    setStage(2, validateRes?.status === 'UNAVAILABLE' ? 'unavailable' : 'done');

    // Stage 4 — Detect (tamper)
    setStage(3, 'active');
    document.getElementById('stageDetail').innerHTML =
      `<strong style="color:var(--navy);">04 Detect</strong> — ${stageDetails.detect} <span class="tag">detect</span>`;
    const detectRes = await API.stageDetect(payload);
    if (signal.aborted) return;
    if (detectRes?.status === 'FLAG' || detectRes?.status === 'REVIEW') document.getElementById('heatmapOverlay').classList.add('on');
    setStage(3, detectRes?.status === 'UNAVAILABLE' ? 'unavailable' : 'done');

    // Stage 5 — Verify (face match)
    setStage(4, 'active');
    document.getElementById('stageDetail').innerHTML =
      `<strong style="color:var(--navy);">05 Verify</strong> — ${stageDetails.verify} <span class="tag">verify</span>`;
    const verifyRes = await API.stageVerify(payload);
    if (signal.aborted) return;
    setStage(4, verifyRes?.status === 'UNAVAILABLE' ? 'unavailable' : 'done');

    // Stage 6 — Log / risk fusion
    setStage(5, 'active');
    document.getElementById('stageDetail').innerHTML =
      `<strong style="color:var(--navy);">06 Log/Anchor</strong> — ${stageDetails.log} <span class="tag">log</span>`;
    const logRes = await API.stageLog({
      caseRef: payload.caseRef,
      extractionData: extractRes || {},
      tamperRes: detectRes || {},
      verifyRes: verifyRes || {}
    });
    if (signal.aborted) return;

    // Surface result gracefully
    if (logRes.compositeScore !== null && logRes.compositeScore !== undefined) {
      drawGaugeAnimated(logRes.compositeScore);
    } else {
      document.getElementById('gaugeNum').innerHTML = '<span style="font-size:11px; font-weight:600; color:var(--text-secondary);">UNAVAILABLE</span>';
      drawGaugeAnimated(0);
    }
    
    const badge = document.getElementById('verdictBadge');

    if (logRes.suggestedDecision === 'clear') {
      document.getElementById('pipelineMeta').textContent = 'Complete — awaiting decision';
      badge.className = 'status status-clear';
      badge.innerHTML = PRAMAAN.ICONS.check + ' Clear';
      document.getElementById('btnApprove').classList.add('recommended');
      setStage(5, 'done');
    } else if (logRes.suggestedDecision === 'UNAVAILABLE') {
      document.getElementById('pipelineMeta').textContent = 'Verification incomplete — awaiting ML integration';
      badge.className = 'status status-pending';
      badge.innerHTML = 'Awaiting ML integration';
      setStage(5, 'unavailable');
    } else {
      document.getElementById('pipelineMeta').textContent = 'Complete — awaiting decision';
      badge.className = 'status status-flag';
      badge.innerHTML = PRAMAAN.ICONS.flagIcon + ' Flag for review';
      setStage(5, 'flagged');
    }
    ['btnApprove', 'btnFlag', 'btnReject'].forEach(id => document.getElementById(id).disabled = false);

  } catch (e) {
    if (!signal.aborted) console.error('Pipeline error:', e);
  }
}

// ---- Officer decision ----
async function commitDecision(kind) {
  ['btnApprove', 'btnFlag', 'btnReject'].forEach(id => document.getElementById(id).disabled = true);

  const hash = await PRAMAAN.hashFromRef(caseRef);
  const anchorRes = await API.anchorDecision({ caseRef, decision: kind });

  document.getElementById('anchorHash').textContent = hash;
  document.getElementById('anchorTime').textContent = anchorRes.timestamp;
  document.getElementById('blockNum').textContent   = anchorRes.blockNum;

  const result = document.getElementById('anchorResult');
  const title  = result.querySelector('.title');
  const map = {
    approve: ['#38A169', PRAMAAN.ICONS.check    + ' Case approved — Anchored to local ledger'],
    flag:    ['#D69E2E', PRAMAAN.ICONS.flagIcon + ' Case flagged — Handed to second officer'],
    reject:  ['#C53030', PRAMAAN.ICONS.x        + ' Case rejected — Suspect referred to holding'],
  };
  result.style.borderColor = map[kind][0];
  result.style.background  = kind === 'approve' ? '#E6F4EC' : kind === 'flag' ? '#FCF3DD' : '#FBE7E7';
  title.style.color        = map[kind][0];
  title.innerHTML          = map[kind][1];
  result.classList.add('show');
}

document.getElementById('btnApprove').addEventListener('click', () => commitDecision('approve'));
document.getElementById('btnFlag').addEventListener('click',    () => commitDecision('flag'));
document.getElementById('btnReject').addEventListener('click',  () => commitDecision('reject'));

// --- State ---
let capturedDocImage = null;   // base64 data URL
let capturedFaceImage = null;  // base64 data URL
let docStream = null;          // active document camera MediaStream
let faceStream = null;         // active face camera MediaStream

// --- Canvas (off-screen) for snapshot ---
const snapCanvas = document.createElement('canvas');

function stopStream(stream) {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
}

function showCaptureError(msg) {
  const el = document.getElementById('captureError');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function updateRunButton() {
  const btn = document.getElementById('btnRunScreening');
  const hasDoc  = !!capturedDocImage;
  const hasFace = !!capturedFaceImage;
  btn.disabled = !(hasDoc && hasFace);
  btn.title = !hasDoc ? 'Document capture required' : !hasFace ? 'Live face capture required' : 'Ready to run';
  showCaptureError('');
}

function captureFrameFromVideo(videoEl) {
  snapCanvas.width  = videoEl.videoWidth  || 640;
  snapCanvas.height = videoEl.videoHeight || 480;
  const ctx = snapCanvas.getContext('2d');
  ctx.drawImage(videoEl, 0, 0, snapCanvas.width, snapCanvas.height);
  return snapCanvas.toDataURL('image/jpeg', 0.92);
}

function basicImageQualityCheck(dataUrl) {
  // Lightweight client-side check: image must be non-trivial size (> 2KB)
  if (!dataUrl || dataUrl.length < 2000) return false;
  return true;
}

// --- DOCUMENT CAMERA ---
async function startDocCamera() {
  stopStream(docStream);
  docStream = null;
  const video = document.getElementById('docVideo');
  const docSvg = document.getElementById('docSvg');
  const docPreview = document.getElementById('docPreview');
  try {
    docStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    video.srcObject = docStream;
    video.style.display = 'block';
    docSvg.style.display = 'none';
    docPreview.style.display = 'none';
    document.getElementById('docCaptureActions').style.display = 'none';
    document.getElementById('docActiveActions').style.display  = 'flex';
    document.getElementById('docTypeLbl').textContent = '● Camera active';
    document.getElementById('docTypeLbl').style.color = 'var(--clear)';
    showCaptureError('');
  } catch (err) {
    stopStream(docStream);
    docStream = null;
    const msg = (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')
      ? 'Camera access denied. Upload a document image instead.'
      : 'No camera device found. Upload a document image instead.';
    showCaptureError(msg);
    document.getElementById('docCaptureActions').style.display = 'flex';
    document.getElementById('docActiveActions').style.display  = 'none';
    document.getElementById('docTypeLbl').textContent = 'Passport (MRZ)';
    document.getElementById('docTypeLbl').style.color = '';
  }
}

function captureDocFromCamera() {
  const video = document.getElementById('docVideo');
  const dataUrl = captureFrameFromVideo(video);
  if (!basicImageQualityCheck(dataUrl)) {
    showCaptureError('Capture quality insufficient — please retry.');
    return;
  }
  stopStream(docStream);
  docStream = null;
  capturedDocImage = dataUrl;
  showDocPreview(dataUrl);
  updateRunButton();
}

function cancelDocCamera() {
  stopStream(docStream);
  docStream = null;
  const video = document.getElementById('docVideo');
  video.style.display = 'none';
  video.srcObject = null;
  document.getElementById('docSvg').style.display  = 'block';
  document.getElementById('docCaptureActions').style.display = 'flex';
  document.getElementById('docActiveActions').style.display  = 'none';
  document.getElementById('docTypeLbl').textContent = 'Passport (MRZ)';
  document.getElementById('docTypeLbl').style.color = '';
  showCaptureError('');
}

function showDocPreview(dataUrl) {
  const preview = document.getElementById('docPreview');
  const video   = document.getElementById('docVideo');
  const docSvg  = document.getElementById('docSvg');
  preview.src = dataUrl;
  preview.style.display = 'block';
  video.style.display   = 'none';
  docSvg.style.display  = 'none';
  document.getElementById('docCaptureActions').style.display = 'flex';
  document.getElementById('docActiveActions').style.display  = 'none';
  document.getElementById('docTypeLbl').textContent = '✓ Document captured';
  document.getElementById('docTypeLbl').style.color = 'var(--clear)';
}

function resetDocCapture() {
  stopStream(docStream);
  docStream = null;
  capturedDocImage = null;
  const video   = document.getElementById('docVideo');
  const preview = document.getElementById('docPreview');
  const docSvg  = document.getElementById('docSvg');
  video.style.display    = 'none';
  video.srcObject        = null;
  preview.style.display  = 'none';
  docSvg.style.display   = 'block';
  document.getElementById('docCaptureActions').style.display = 'flex';
  document.getElementById('docActiveActions').style.display  = 'none';
  document.getElementById('docTypeLbl').textContent = 'Passport (MRZ)';
  document.getElementById('docTypeLbl').style.color = '';
  document.getElementById('fileDoc').value = '';

}

// File upload handler
document.getElementById('fileDoc').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    showCaptureError('Invalid file type. Please select an image.');
    this.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    const dataUrl = e.target.result;
    if (!basicImageQualityCheck(dataUrl)) {
      showCaptureError('Image file appears empty or unreadable. Try another file.');
      return;
    }
    capturedDocImage = dataUrl;
    showDocPreview(dataUrl);
    updateRunButton();
  };
  reader.onerror = () => showCaptureError('Could not read file. Try another image.');
  reader.readAsDataURL(file);
});

document.getElementById('btnDocCamera').addEventListener('click',   startDocCamera);
document.getElementById('btnCaptureDoc').addEventListener('click',  captureDocFromCamera);
document.getElementById('btnCancelDoc').addEventListener('click',   cancelDocCamera);

// --- FACE CAMERA ---
async function startFaceCamera() {
  stopStream(faceStream);
  faceStream = null;
  const video = document.getElementById('modalFaceVideo');
  
  try {
    faceStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = faceStream;
    document.getElementById('faceModal').style.display = 'flex';
    showCaptureError('');
  } catch (err) {
    stopStream(faceStream);
    faceStream = null;
    const msg = (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError')
      ? 'Camera access denied for face capture.'
      : 'No camera found for face capture.';
    showCaptureError(msg);
  }
}

function captureFaceFromCamera() {
  const video = document.getElementById('modalFaceVideo');
  const dataUrl = captureFrameFromVideo(video);
  if (!basicImageQualityCheck(dataUrl)) {
    alert('Face capture quality insufficient — please retry.');
    return;
  }
  
  // Mirror the image horizontally because we display it mirrored
  const img = new Image();
  img.onload = function() {
    snapCanvas.width = img.width;
    snapCanvas.height = img.height;
    const ctx = snapCanvas.getContext('2d');
    ctx.translate(snapCanvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(img, 0, 0);
    const flippedDataUrl = snapCanvas.toDataURL('image/jpeg', 0.92);
    
    stopStream(faceStream);
    faceStream = null;
    document.getElementById('faceModal').style.display = 'none';
    capturedFaceImage = flippedDataUrl;
    showFacePreview(flippedDataUrl);
    updateRunButton();
  };
  img.src = dataUrl;
}

function cancelFaceCamera() {
  stopStream(faceStream);
  faceStream = null;
  const video = document.getElementById('modalFaceVideo');
  video.srcObject = null;
  document.getElementById('faceModal').style.display = 'none';
  showCaptureError('');
}

function showFacePreview(dataUrl) {
  const preview = document.getElementById('facePreview');
  const video   = document.getElementById('faceVideo');
  const faceSvg = document.getElementById('faceSvg');
  preview.src = dataUrl;
  preview.style.display = 'block';
  video.style.display   = 'none';
  faceSvg.style.display = 'none';
  document.getElementById('faceCaptureActions').style.display = 'flex';
  document.getElementById('faceActiveActions').style.display  = 'none';
  // Swap Start button to Retry
  document.getElementById('btnStartFaceCam').textContent = '↺ Retry face';
}

function resetFaceCapture() {
  stopStream(faceStream);
  faceStream = null;
  capturedFaceImage = null;
  const video   = document.getElementById('faceVideo');
  const preview = document.getElementById('facePreview');
  const faceSvg = document.getElementById('faceSvg');
  video.style.display    = 'none';
  video.srcObject        = null;
  preview.style.display  = 'none';
  faceSvg.style.display  = 'block';
  document.getElementById('faceCaptureActions').style.display = 'flex';
  document.getElementById('faceActiveActions').style.display  = 'none';
    document.getElementById('btnStartFaceCam').textContent = 'Start face camera';
  updateRunButton();
}

document.getElementById('btnStartFaceCam').addEventListener('click',  startFaceCamera);
document.getElementById('btnModalCaptureFace').addEventListener('click', captureFaceFromCamera);
document.getElementById('btnModalCancelFace').addEventListener('click',  cancelFaceCamera);

// --- NEW CAPTURE / RESTART ---
function fullReset() {
  resetDocCapture();
  resetFaceCapture();
  // Reset pipeline & results UI
  window.stageStates = [];
  abortController.abort();
  abortController = new AbortController();
  drawGauge(0);
  document.getElementById('gaugeNum').innerHTML = '—<span class="of">/100</span>';
  document.getElementById('verdictBadge').className = 'status status-pending';
  document.getElementById('verdictBadge').innerHTML = 'Awaiting pipeline';
  ['btnApprove', 'btnFlag', 'btnReject'].forEach(id => document.getElementById(id).disabled = true);
  document.getElementById('pipelineMeta').textContent = 'Awaiting capture…';
  document.getElementById('anchorResult').classList.remove('show');
  document.getElementById('heatmapOverlay').classList.remove('on');
  document.getElementById('fieldReadout').style.opacity = '0';
  document.getElementById('btnApprove').classList.remove('recommended');
  document.getElementById('stageDetail').innerHTML = 'Capture a document and live face to begin screening.';
  // Reset stage rail to blank
  document.querySelectorAll('.p-stage').forEach(n => n.classList.remove('active','done','flagged','error','unavailable'));
  showCaptureError('');
}

document.getElementById('restartBtn').addEventListener('click', fullReset);

// --- 1-CLICK AI TEST SCENARIOS (Real Synthetic PNG Generation) ---
async function loadSyntheticScenario(scenario, label, color) {
  try {
    document.getElementById('stageDetail').innerHTML = 'Generating synthetic AI document (' + scenario + ')…';
    const res = await API.generateSyntheticData(scenario);
    capturedDocImage = res.document_base64;
    capturedFaceImage = res.avatar_base64;
    showDocPreview(capturedDocImage);
    showFacePreview(capturedFaceImage);
    document.getElementById('docTypeLbl').textContent = label;
    document.getElementById('docTypeLbl').style.color = color;
    updateRunButton();
    runScreening(scenario.toLowerCase());
  } catch (err) {
    showCaptureError('Failed to generate synthetic scenario: ' + err.message);
  }
}

// --- Run Screening (real capture gate) ---
document.getElementById('btnRunScreening').addEventListener('click', () => {
  if (!capturedDocImage) { showCaptureError('Document capture required before screening.'); return; }
  if (!capturedFaceImage) { showCaptureError('Live face capture required before screening.'); return; }
  runScreening('live');
});

async function runScreening(mode) {
  // Stop any lingering camera streams before pipeline starts
  stopStream(docStream);  docStream = null;
  stopStream(faceStream); faceStream = null;

  window.stageStates = [];
  abortController.abort();
  abortController = new AbortController();

  // Stage 01 Capture: mark done now that we have real images
  setStage(0, 'done');
  document.getElementById('pipelineMeta').textContent = 'Running…';
  document.getElementById('gaugeNum').innerHTML = '—<span class="of">/100</span>';
  document.getElementById('verdictBadge').className = 'status status-pending';
  document.getElementById('verdictBadge').innerHTML = 'Awaiting pipeline';
  ['btnApprove', 'btnFlag', 'btnReject'].forEach(id => document.getElementById(id).disabled = true);
  document.getElementById('anchorResult').classList.remove('show');
  document.getElementById('heatmapOverlay').classList.remove('on');
  document.getElementById('fieldReadout').style.opacity = '0';
  document.getElementById('btnApprove').classList.remove('recommended');
  drawGauge(0);

  const enrichedPayload = {
    mode,
    caseRef,
    documentImage: capturedDocImage,
    faceImage: capturedFaceImage
  };
  await runPipeline(enrichedPayload, abortController.signal);
}

});

});

})();
