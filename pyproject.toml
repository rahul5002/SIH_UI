[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pramaan-ai"
version = "1.0.0"
description = "AI-Powered Document Screening Platform"
authors = [
    {name = "PRAMAAN AI Team"}
]
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "opencv-python-headless",
    "numpy",
    "Pillow",
    "easyocr",
    "onnxruntime",
    "python-multipart",
    "PyWavelets"
]

[tool.setuptools.packages.find]
include = ["src*"]
